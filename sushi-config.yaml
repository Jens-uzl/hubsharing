  transactions.md:
    title: Interhub Transactions (Discovery, Retrieval & Lab Observations)
  security.md:
    title: Interhub Security & Authentication Architecture
  end-to-end-encryption.md:
    title: End-to-End Encryption (Discussion Paper)
  lab-report-sharing.md:
    title: Laboratory Report Document Sharing (LabReport)
  mapping-telemonitoring-to-hub.md:
    title: Telemonitoring Document Sharing
  tmp-base-message.md:
    title: TMP Base Message (Telemonitoring Appendix)
  mapping-kmehr-to-hub.md:
    title: KMEHR to FHIR MHD Mapping Matrix
  ihe-mhd-alignment.md:
    title: IHE MHD Alignment & Open Discussions
  minimal-vs-comprehensive.md:
    title: Minimal vs. Comprehensive DocumentReference
  ehds-alignment.md:
