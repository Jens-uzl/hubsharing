id: fhir.hubsharing
canonical: https://www.ehealth.fgov.be/standards/fhir/interhub
name: BelgianInterhubDocumentSharing
title: Belgian Federated Interhub FHIR Document Sharing Implementation Guide
description: Technical specification and migration guide from legacy Belgian KMEHR SOAP Web Services to RESTful HL7 FHIR IHE MHD Document Sharing, aligned with the European Health Data Space (EHDS).
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
publisher:
  name: eHealth Platform Belgium & UZ Leuven
  url: https://www.ehealth.fgov.be

contact:
  - name: eHealth Platform
    telecom:
      - system: url
        value: https://www.ehealth.fgov.be
      - system: email
        value: support@ehealth.fgov.be

dependencies:
  hl7.fhir.be.core:
    id: beCore
    uri: https://www.ehealth.fgov.be/standards/fhir/core/ImplementationGuide/hl7.fhir.be.core
    version: 2.1.2
  hl7.fhir.be.core-clinical:
    id: beCoreClinical
    uri: https://www.ehealth.fgov.be/standards/fhir/core-clinical/ImplementationGuide/hl7.fhir.be.core-clinical
    version: 1.1.0
  hl7.fhir.be.patient-monitoring:
    id: bePatientMonitoring
    uri: http://hl7belgium.org/fhir/patient-monitoring/ImplementationGuide/hl7.fhir.be.patient-monitoring
    version: current
  ihe.iti.mhd:
    id: iheMhd
    uri: https://profiles.ihe.net/ITI/MHD/ImplementationGuide/ihe.iti.mhd
    version: 4.2.2

pages:
  index.md:
    title: Belgian Interhub FHIR Document Sharing Guide
  architecture.md:
    title: Architecture & Interhub Ecosystem
  resource-considerations.md:
